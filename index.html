<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrations Opening Soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    font-family: "Plus Jakarta Sans", sans-serif;
    background: #050505;
    color: #fff;
    overflow: hidden;
}

.coming-soon {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(111, 35, 255, 0.15) 0%,
            rgba(111, 35, 255, 0.06) 25%,
            transparent 55%
        ),
        #050505;
    isolation: isolate;
}

.glow {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(110px);
    z-index: -1;
}

.glow-one {
    width: 420px;
    height: 420px;
    top: -200px;
    right: -120px;
    background: rgba(126, 42, 255, 0.18);
}

.glow-two {
    width: 380px;
    height: 380px;
    bottom: -200px;
    left: -120px;
    background: rgba(82, 20, 180, 0.14);
}

.content {
    position: relative;
    width: min(90%, 900px);
    text-align: center;
    animation: fadeUp 1s ease forwards;
}

.eventer-logo {
    display: block;
    width: min(155px, 32vw);
    height: auto;
    margin: 0 auto 30px;
    object-fit: contain;
}

.line {
    width: 42px;
    height: 1px;
    margin: 0 auto 38px;
    background: #8b4dff;
    opacity: 0.8;
}

h1 {
    font-size: clamp(42px, 7vw, 88px);
    line-height: 1.08;
    letter-spacing: -0.055em;
    font-weight: 600;
}

h1 span {
    color: #9b5cff;
}

p {
    margin-top: 30px;
    font-size: 15px;
    line-height: 1.7;
    color: rgba(255,255,255,0.45);
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {
    .eventer-logo {
        width: min(150px, 30vw);
        margin-bottom: 25px;
    }

    .line {
        margin-bottom: 30px;
    }

    h1 {
        font-size: 43px;
        letter-spacing: -0.045em;
    }

    p {
        font-size: 13px;
        margin-top: 24px;
    }
}
</style>
</head>
